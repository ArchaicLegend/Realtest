<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drum counter that carries</title>
    <meta name="theme-color" content="#111111" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Drum counter that carries</h1>

      <div id="odometer"></div>

      <div class="controls">
        <button data-add="1">+1</button>
        <button data-add="37">+37</button>
        <button data-add="1000">+1,000</button>
        <button id="pause">Pause</button>
      </div>
    </main>

    <footer>
      <a href="https://www.npmjs.com/package/tactile-odometer">tactile-odometer</a> ·
      MIT ·
      <a href="https://www.npmjs.com/package/tactile-odometer">npm i tactile-odometer</a>
    </footer>

    <script type="module" src="script.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      }
    </script>
  </body>
</html>
