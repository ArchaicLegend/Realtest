<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contador</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <div id="odometer"></div>

      <div class="controls">
        <input
          id="amount"
          type="number"
          inputmode="numeric"
          min="0"
          max="999999"
          step="1"
          placeholder="Número"
          aria-label="Número"
        />
        <button id="add">Somar</button>
        <button id="sub">Subtrair</button>
        <button id="set">Definir</button>
        <button id="reset">Resetar</button>
        <button id="pause">Pausar</button>
      </div>
    </main>

    <footer>
      <a href="https://www.npmjs.com/package/tactile-odometer">tactile-odometer</a> ·
      MIT ·
      <a href="https://www.npmjs.com/package/tactile-odometer">npm i tactile-odometer</a>
    </footer>

    <script type="module" src="script.js"></script>
  </body>
</html>
